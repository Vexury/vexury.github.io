<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <a href="/" class="{% if page.url == '/' %}active{% endif %}">/ Home</a>
        <a href="/projects/" class="{% if page.url contains '/projects' %}active{% endif %}">/ Projects</a>
      </nav>
    </header>
    
    <main>
      {{ content }}
    </main>
    
    <footer>
      <p>Moritz Grauer © 2026</p>
    </footer>
  </div>
  <script>
    document.querySelectorAll('a[href^="http"]').forEach(a => {
      if (!a.hostname || a.hostname !== location.hostname) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    });
  </script>
</body>
</html>

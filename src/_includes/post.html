---
layout: base.html
---
<div class="post-content">{{ content }}</div>
<script>
(function () {
  var headings = document.querySelectorAll('.post-content h2');
  if (headings.length < 2) return;

  /* Build nav */
  var nav = document.createElement('nav');
  nav.className = 'toc';
  nav.setAttribute('aria-label', 'Table of contents');

  var titleEl = document.createElement('span');
  titleEl.className = 'toc-title';
  titleEl.textContent = 'On this page';
  nav.appendChild(titleEl);

  var list = document.createElement('ul');
  list.className = 'toc-list';
  var usedIds = {};

  headings.forEach(function (h) {
    if (!h.id) {
      var base = h.textContent.trim()
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      var id = base, n = 2;
      while (usedIds[id]) { id = base + '-' + (n++); }
      usedIds[id] = true;
      h.id = id;
    }
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.addEventListener('click', function (e) {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth' });
      history.pushState(null, '', '#' + h.id);
    });
    li.appendChild(a);
    list.appendChild(li);
  });

  nav.appendChild(list);

  /* Insert after .post-date, falling back to after h1 */
  var anchor = document.querySelector('.post-content .post-date')
            || document.querySelector('.post-content h1');
  if (anchor) anchor.after(nav);

  /* Highlight active section */
  var links = list.querySelectorAll('a');
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        links.forEach(function (l) { l.classList.remove('toc-active'); });
        var active = list.querySelector('a[href="#' + entry.target.id + '"]');
        if (active) active.classList.add('toc-active');
      }
    });
  }, { rootMargin: '-5% 0px -85% 0px' });

  headings.forEach(function (h) { observer.observe(h); });

  /* Back-to-top button */
  var btn = document.createElement('button');
  btn.className = 'back-to-top';
  btn.textContent = '↑ top';
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.body.appendChild(btn);

  window.addEventListener('scroll', function () {
    btn.classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });
})();
</script>

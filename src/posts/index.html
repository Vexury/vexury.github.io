---
layout: base.html
title: Blog Posts
---

<h1>Blog</h1>

<ul class="post-list">
{% for post in collections.posts | reverse %}
  <li>
    <a href="{{ post.url }}">
      <h3>{{ post.data.title }}</h3>
      <span class="post-date">{{ post.data.date | date: "%B %d, %Y" }}</span>
    </a>
  </li>
{% endfor %}
</ul>

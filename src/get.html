<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Puzzle Hustle, daily logic puzzles for Android and iOS. Free, plays offline.">
  <link rel="canonical" href="{{ site.url }}/get/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="Get Puzzle Hustle">
  <meta property="og:description" content="Daily logic puzzles for Android and iOS. Free, plays offline.">
  <meta property="og:url" content="{{ site.url }}/get/">
  <meta property="og:image" content="{{ site.url }}/images/PuzzleHustle/get/feature.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111110">
  <link rel="icon" href="/images/PuzzleHustle/get/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/PuzzleHustle/get/icon.png">
  <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/ph-landing.css">
</head>
<body>
  <main>
    <img class="hero" src="/images/PuzzleHustle/get/feature.png" width="1024" height="500" alt="Puzzle Hustle: Zip, Sudoku, Nonogram, Slabs, Tracks and more puzzle boards">
    <div class="app">
      <img src="/images/PuzzleHustle/get/icon.png" width="64" height="64" alt="">
      <div>
        <h1>Puzzle Hustle</h1>
        <p>Daily logic puzzles</p>
      </div>
    </div>
    <p class="pitch">Ten kinds of logic puzzles and a fresh set every day. Free, and it plays offline.</p>
    <div class="stores">
      <a id="get-play" class="play" href="https://play.google.com/store/apps/details?id=dev.vexury.puzzlehustle"><img src="/images/PuzzleHustle/get/google-play.png" alt="Get it on Google Play"></a>
      <a id="get-ios" class="apple" href="https://apps.apple.com/app/id6814679756"><img src="/images/PuzzleHustle/get/app-store.svg" alt="Download on the App Store"></a>
    </div>
    <a class="web" href="/projects/puzzle-hustle/">Or play in your browser →</a>
  </main>
  <footer>Made by <a href="/">Vexury</a></footer>

  <!-- Bio link for social accounts: /get/?src=tiktok|instagram|shorts. The source goes into
       the Play UTM referrer and the App Store campaign token; phones go straight to their store. -->
  <script>
    (function () {
      var PT = '129494133';
      var m = /[?&]src=([a-z0-9-]{1,32})(?:&|$)/.exec(location.search);
      var src = m ? m[1] : 'site';
      var play = 'https://play.google.com/store/apps/details?id=dev.vexury.puzzlehustle&referrer=' +
        encodeURIComponent('utm_source=' + src + '&utm_medium=' + (m ? 'social' : 'web') + '&utm_campaign=bio');
      var appStore = 'https://apps.apple.com/app/apple-store/id6814679756?pt=' + PT + '&ct=' + src + '-bio&mt=8';
      document.getElementById('get-play').href = play;
      document.getElementById('get-ios').href = appStore;

      var ua = navigator.userAgent;
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (/Android/.test(ua)) location.replace(play);
      else if (ios) location.replace(appStore);
    })();
  </script>
</body>
</html>
